version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-west-1 | docker login --username AWS --password-stdin 499502048569.dkr.ecr.us-west-1.amazonaws.com
      - IMAGE_TAG=latest
  build:
    commands:
      - echo Building the Docker image...
      - docker build --platform linux/amd64 -t calender .
      - docker tag calender:latest 499502048569.dkr.ecr.us-west-1.amazonaws.com/calender:$IMAGE_TAG
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push 499502048569.dkr.ecr.us-west-1.amazonaws.com/calender:$IMAGE_TAG
      - echo Build completed successfully.

artifacts: ##files that are generated by the build process and that you want to store in S3. You can specify the files to include or exclude.
  files: []
